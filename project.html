<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Samuel Liu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">Samuel Liu</a>
      <ul class="nav-links">
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="experience.html">Experience</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div id="project-detail">
      <p class="empty-state">Loading…</p>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="mailto:syl63@cam.ac.uk">Email</a>
      <a href="https://www.linkedin.com/in/samliu12/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/samuelliu12" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    (function () {
      function slugify(title) {
        return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }

      const id = new URLSearchParams(location.search).get('id');
      const detail = document.getElementById('project-detail');

      if (!id) {
        detail.innerHTML = '<p class="empty-state">No project specified.</p>';
        return;
      }

      // cache-bust: http.server sends no Cache-Control, so browsers serve a stale
      // copy without revalidating and edits to the JSON stay invisible
      fetch('data/projects.json?v=' + Date.now())
        .then(r => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then(projects => {
          const p = projects.find(proj => slugify(proj.title) === id);
          if (!p) {
            detail.innerHTML = '<p class="empty-state">Project not found.</p>';
            return;
          }

          document.title = `${p.title} — Samuel Liu`;

          const tags = p.tags.map(t => `<span class="tag tag-${t}">${t}</span>`).join('');
          const linkItems = (p.links || []);
          const linksSection = linkItems.length ? `
            <div class="detail-section">
              <h2 class="section-label">Links</h2>
              <ul class="contact-list detail-links">
                ${linkItems.map(l => l.url
                  ? `<li><span>${l.label}</span><a href="${l.url}" target="_blank" rel="noopener">${l.url.replace(/^https?:\/\/(www\.)?/, '')} ↗</a></li>`
                  : `<li><span>${l.label}</span><em class="card-link-pending">coming soon</em></li>`).join('')}
              </ul>
            </div>` : '';

          const heroSrc = p.detail_image || p.image;
          const pos = p.image_position && !p.detail_image ? ` style="object-position: ${p.image_position}"` : '';
          const hero = heroSrc
            ? `<img src="${heroSrc}" alt="${p.title}" class="detail-hero"${pos}>`
            : '';

          const summary = p.summary ? `
            <div class="detail-section">
              <h2 class="section-label">Summary</h2>
              <p class="detail-text">${p.summary}</p>
            </div>` : '';

          const whatIDid = p.what_i_did && p.what_i_did.length ? `
            <div class="detail-section">
              <h2 class="section-label">What I did</h2>
              <ul class="detail-bullets">
                ${p.what_i_did.map(item => `<li>${item}</li>`).join('')}
              </ul>
            </div>` : '';

          const outcome = p.results && p.results.length ? `
            <div class="detail-section">
              <h2 class="section-label">Results</h2>
              <ul class="detail-bullets">
                ${p.results.map(item => `<li>${item}</li>`).join('')}
              </ul>
            </div>` : p.future_steps && p.future_steps.length ? `
            <div class="detail-section">
              <h2 class="section-label">Future steps</h2>
              <ul class="detail-bullets">
                ${p.future_steps.map(item => `<li>${item}</li>`).join('')}
              </ul>
            </div>` : '';

          const galleryImages = (p.images || []).filter(Boolean);
          const gallery = galleryImages.length ? `
            <div class="detail-section">
              <h2 class="section-label">Images</h2>
              <div class="detail-gallery">
                ${galleryImages.map(src => `<img src="${src}" alt="" loading="lazy">`).join('')}
              </div>
            </div>` : '';

          const skills = p.skills && p.skills.length ? `
            <div class="detail-section">
              <h2 class="section-label">Skills</h2>
              <div class="detail-skills">
                ${p.skills.map(s => `<span class="detail-skill-chip">${s}</span>`).join('')}
              </div>
            </div>` : '';

          detail.innerHTML = `
            <p class="breadcrumb"><a href="projects.html">Projects</a> / ${p.title}</p>
            ${hero}
            <div class="detail-header">
              <h1 class="detail-title">${p.title}</h1>
              <div class="detail-meta">
                <div class="card-tags">${tags}</div>
              </div>
            </div>
            ${summary}
            ${whatIDid}
            ${outcome}
            ${gallery}
            ${skills}
            ${linksSection}
            <div class="detail-back">
              <a href="projects.html">← All projects</a>
            </div>
          `;
        })
        .catch(() => {
          detail.innerHTML = '<p class="empty-state">To preview locally, run: python3 -m http.server 8080</p>';
        });
    })();
  </script>
</body>

</html>
